<style>
:root{
  --bg:#FFF7E8;--card:#FFFFFF;--ink:#1F2A44;--muted:#5D6478;--rule:#F0E4C8;
  --accent:#1D5FC2;--badge:#1F2A44;--badge-ink:#FFC93C;--soft:#FFF3D6;--mark:#E2A524;
  --hero:#FFD25E;--hero-ink:#1F2A44;--hero-sub:#5A4A1E;--disc:#FFE59A;--hill:rgba(243,184,58,.55);
  --pill:rgba(255,255,255,.6);--pill-line:rgba(31,42,68,.18);
  --contact-a:#1F2A44;--contact-b:#2C3D6B;
  --shadow:0 1px 2px rgba(31,42,68,.06),0 8px 28px rgba(31,42,68,.09);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111727;--card:#1A2236;--ink:#ECEFF6;--muted:#A6AEC0;--rule:#2A3350;
  --accent:#8DB8F5;--badge:#FFC93C;--badge-ink:#1F2A44;--soft:#232C45;--mark:#FFC93C;
  --hero:#2A3A66;--hero-ink:#FFFFFF;--hero-sub:#C9D0E0;--disc:rgba(255,255,255,.07);--hill:rgba(17,23,39,.5);
  --pill:rgba(255,255,255,.1);--pill-line:rgba(255,255,255,.22);
  --contact-a:#26355C;--contact-b:#30447A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.75;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent)}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink)}
.hero .disc{position:absolute;right:-70px;top:-90px;width:330px;height:330px;border-radius:50%;background:var(--disc)}
.hero .hill{position:absolute;left:-10%;right:-10%;bottom:-120px;height:200px;border-radius:50%;background:var(--hill)}
.hero-in{position:relative;z-index:1;max-width:760px;margin:0 auto;
  padding:44px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px))}
.globe{position:absolute;right:16px;top:22px;width:150px;height:150px}
.hero h1{margin:0 0 12px;max-width:calc(100% - 150px);font-size:2.2rem;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.lead{margin:0;max-width:calc(100% - 150px);font-size:1.02rem}
main{position:relative;z-index:2;max-width:760px;margin:-60px auto 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.app-head{display:flex;align-items:center;gap:14px}
.app-head img{flex:none;width:64px;height:64px;border-radius:16px;box-shadow:0 1px 3px rgba(31,42,68,.18)}
.app-head h2{margin:0;font-size:1.3rem;line-height:1.3;letter-spacing:-.015em}
.meta{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.card p.desc{margin:16px 0 18px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:999px;
  background:var(--badge);color:var(--badge-ink);font-weight:800;font-size:.95rem;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.contact{margin-top:14px;display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;color:#fff;
  background:linear-gradient(140deg,var(--contact-a),var(--contact-b))}
.contact .ic{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:12px;background:rgba(255,201,60,.2)}
.contact p{margin:0;line-height:1.7}
.contact .k{opacity:.75}
.contact a{color:#FFC93C;font-weight:700;text-decoration:none}
footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.84rem}
footer p{margin:4px 0}
@media (max-width:560px){
  .globe{width:96px;height:96px;right:10px;top:18px}
  .hero h1{max-width:calc(100% - 92px);font-size:1.9rem}
  .lead{max-width:calc(100% - 92px)}
  .hero-in{padding-top:34px;padding-bottom:88px}
  .card{padding:18px 16px}
}
</style>
</head>
